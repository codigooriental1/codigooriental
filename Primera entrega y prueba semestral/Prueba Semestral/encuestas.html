<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.G.S.M. | Encuestas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">

</head>


<body>


<div class="bg-light border-bottom py-2">

    <div class="container">

        <small class="text-muted">

            📞 Atención al Usuario:
            <strong>1953 / 0800 1953</strong>

            <span class="mx-3">|</span>

            📧 atencionalusuario@hc.edu.uy

        </small>

    </div>

</div>



<header class="bg-white py-4 border-bottom">


    <div class="container text-center">


        <img
            src="https://hc.edu.uy/images/imagenesarticulos/Logo_Hc.png"
            width="400"
            alt="Hospital de Clínicas"
            class="logo">


        <h1 class="display-5 mt-3">
            Encuestas
        </h1>


        <p class="lead">
            Encuesta de satisfacción del paciente.
        </p>


    </div>


</header>




<main class="container my-5">



<div class="mb-4">


    <a href="index.html" class="btn btn-outline-primary btn-lg px-5 py-3">

        ← Volver al inicio

    </a>


</div>





<section class="row justify-content-center">


<div class="col-12 col-xl-10">



<div class="card tarjeta shadow-sm">


<div class="card-body p-5">


<h3 class="card-title mb-4">

    Encuesta de satisfacción

</h3>





<form>




<div class="mb-4">


<label class="form-label">

    Nombre Completo (opcional)

</label>


<input
type="text"
class="form-control form-control-lg"
placeholder="Ingrese su nombre">


</div>





<div class="mb-4">


<label class="form-label">

    ¿Cómo calificaría la atención recibida?

</label>


<select class="form-select form-select-lg">


<option selected disabled>
Seleccione una opción
</option>


<option>
Excelente
</option>


<option>
Muy buena
</option>


<option>
Buena
</option>


<option>
Regular
</option>


<option>
Mala
</option>


</select>


</div>





<div class="mb-4">


<label class="form-label">

    Comentarios

</label>


<textarea
class="form-control"
rows="5"
placeholder="Escriba aquí sus comentarios..."></textarea>


</div>






<div class="d-grid">


<button class="btn btn-primary btn-lg" type="button">

    Enviar encuesta

</button>


</div>




</form>




</div>


</div>


</div>


</section>



</main>





<footer class="text-center py-4">


<p class="mb-0">

    S.I.G.S.M. - Hospital de Clínicas

</p>


</footer>





<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
